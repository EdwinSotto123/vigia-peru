<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-labelledby="t d"><title id="t">Scale of the problem</title><desc id="d">Contratos publicados, leídos y con riesgo alto</desc><rect width="1100" height="330" rx="18" fill="#0B0F0F"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="700" fill="#E9F0EC" text-anchor="start" >The scale of the problem</text><text x="40" y="80" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#7F918A" text-anchor="start" >Each bar is drawn to scale. 19,388 contracts are still waiting to be read.</text><text x="40" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#E9F0EC" text-anchor="start" >Published contracts</text><rect x="300" y="126" width="700" height="34" rx="8" fill="#121818" stroke="#263232"/><rect x="300" y="126" width="700.0" height="34" rx="8" fill="#B5C2BC"/><text x="1014" y="149" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#B5C2BC" text-anchor="start" >19,653</text><text x="300" y="182" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#7F918A" text-anchor="start" >everything entities uploaded to SEACE</text><text x="40" y="232" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#E9F0EC" text-anchor="start" >Read in depth by Vigía</text><rect x="300" y="210" width="700" height="34" rx="8" fill="#121818" stroke="#263232"/><rect x="300" y="210" width="9.4" height="34" rx="8" fill="#D4FF3F"/><text x="1014" y="233" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#D4FF3F" text-anchor="start" >265</text><text x="300" y="266" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#7F918A" text-anchor="start" >1.3 % of all</text><text x="40" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#E9F0EC" text-anchor="start" >High-risk signals</text><rect x="300" y="294" width="700" height="34" rx="8" fill="#121818" stroke="#263232"/><rect x="300" y="294" width="6.0" height="34" rx="8" fill="#FF6B5E"/><text x="1014" y="317" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FF6B5E" text-anchor="start" >70</text><text x="300" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#7F918A" text-anchor="start" >70 of the 265 read</text></svg>