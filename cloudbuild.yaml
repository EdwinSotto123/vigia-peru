# Cloud Build · despliegue continuo de Vigía Perú.
#
# Trigger sugerido (Cloud Build → Triggers → GitHub → push a main):
#   gcloud builds triggers create github --name=vigia-main --repo-name=vigia-peru \
#     --repo-owner=EdwinSotto123 --branch-pattern='^main$' --build-config=cloudbuild.yaml
#
# Cada paso construye y despliega un servicio desde su carpeta con `gcloud run deploy --source`
# (Cloud Build usa buildpacks o el Dockerfile de la carpeta). Los env vars y secretos ya
# configurados en el servicio se conservan (--update-env-vars mergea).
# Ejecución manual:  gcloud builds submit --config cloudbuild.yaml --substitutions=_DEPLOY=api,frontend
substitutions:
  _REGION: us-central1
  _SQL: vivid-spot-480905-a4:us-central1:vigia-db
  _DEPLOY: "api,frontend"   # subconjunto: api,frontend,agent,agentes,mcp,dispatcher,ingest
  _AR_REPO: us-central1-docker.pkg.dev/vivid-spot-480905-a4/cloud-run-source-deploy

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",api,"* ]] || { echo "skip api"; exit 0; }
        gcloud run deploy vigia-peru-api --source backend/api --region ${_REGION} --allow-unauthenticated \
          --add-cloudsql-instances ${_SQL} --quiet

  - id: frontend
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",frontend,"* ]] || { echo "skip frontend"; exit 0; }
        # NEXT_PUBLIC_* de Firebase: se inyectan desde Secret Manager al build (frontend/.env.production no está en git)
        gcloud secrets versions access latest --secret=frontend-env-production > frontend/.env.production 2>/dev/null || true
        gcloud run deploy vigia-peru-frontend --source frontend --region ${_REGION} --allow-unauthenticated --memory 1Gi --quiet

  - id: agent
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",agent,"* ]] || { echo "skip agent"; exit 0; }
        # Sin --allow-unauthenticated: el deploy no toca la IAM del orquestador (va a ser IAM-only;
        # sus clientes mandan ID token). Los secretos montados (DECOLECTA_API_KEY incluido) se conservan.
        gcloud run deploy agent-orchestrator-adk --source backend/agent --region ${_REGION} \
          --memory 8Gi --cpu 2 --timeout 3600 --concurrency 1 --max-instances 5 \
          --add-cloudsql-instances ${_SQL} --update-env-vars PIPELINE_PROFILE=bienes --quiet

  - id: agentes
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",agentes,"* ]] || { echo "skip agentes"; exit 0; }
        # Los 4 servicios de agentes (bienes/servicios/obras/otros) con UNA imagen:
        # infrastructure/deploy/agentes.sh construye backend/agent con Cloud Build, actualiza
        # agent-orchestrator-adk (--update-env-vars, nunca set) y replica el spec a los otros tres.
        pip3 install --quiet pyyaml
        PYTHON=python3 AR_REPO=${_AR_REPO} bash infrastructure/deploy/agentes.sh all

  - id: mcp
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",mcp,"* ]] || { echo "skip mcp"; exit 0; }
        gcloud run deploy vigia-mcp --source backend/mcp --region ${_REGION} --allow-unauthenticated \
          --add-cloudsql-instances ${_SQL} --quiet

  - id: dispatcher
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",dispatcher,"* ]] || { echo "skip dispatcher"; exit 0; }
        # Cloud Run JOB (no servicio): lo dispara Cloud Scheduler vigia-dispatcher-run cada 5 min.
        # $$ = dólar literal para bash (Cloud Build solo sustituye ${_X})
        # Un servicio de agentes por tipo (backend/dispatcher/main.py url_para): el que no exista queda vacío.
        url_de() { gcloud run services describe "$$1" --region ${_REGION} --format='value(status.url)' 2>/dev/null || true; }
        AGENT_URL="$$(url_de agent-orchestrator-adk)"
        A_SERV="$$(url_de agente-servicios)"; A_OBRAS="$$(url_de agente-obras)"; A_OTROS="$$(url_de agente-otros)"
        gcloud run jobs deploy vigia-dispatcher --source backend/dispatcher --region ${_REGION} \
          --tasks 1 --max-retries 0 --task-timeout 3600 --cpu 1 --memory 512Mi \
          --set-cloudsql-instances ${_SQL} \
          --set-env-vars "AGENT_URL=$${AGENT_URL},AGENT_URL_BIENES=$${AGENT_URL},AGENT_URL_SERVICIOS=$${A_SERV},AGENT_URL_OBRAS=$${A_OBRAS},AGENT_URL_OTROS=$${A_OTROS},PGHOST=/cloudsql/${_SQL},PGUSER=postgres,PGDATABASE=vigia,DISPATCHER_PARALLEL=2,DISPATCHER_MAX_MINUTES=55" \
          --set-secrets "PGPASSWORD=cloudsql-password:latest" --quiet

  - id: ingest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        [[ ",${_DEPLOY}," == *",ingest,"* ]] || { echo "skip ingest"; exit 0; }
        # Cloud Run JOB (no servicio): lo ejecuta infrastructure/deploy/batch-nocturno.sh desde la laptop/VPS
        # al terminar de subir los lotes a gs://vigia-peru-batch. Mismo contexto mínimo que ingest-job.sh.
        CTX="$$(mktemp -d)"
        mkdir -p "$$CTX/backend/scrapers"
        cp -r backend/batch "$$CTX/backend/batch"
        cp -r backend/scrapers/_core "$$CTX/backend/scrapers/_core"
        cp -r backend/scrapers/oece_ocds "$$CTX/backend/scrapers/oece_ocds"
        cp backend/scrapers/__init__.py "$$CTX/backend/scrapers/__init__.py"
        [[ -d backend/core ]] && cp -r backend/core "$$CTX/backend/core"
        find "$$CTX" -type d \( -name __pycache__ -o -name tests \) -prune -exec rm -rf {} +
        cp backend/batch/Dockerfile "$$CTX/Dockerfile"
        gcloud run jobs deploy vigia-ingest --source "$$CTX" --region ${_REGION} \
          --tasks 1 --max-retries 0 --task-timeout 3600 --cpu 1 --memory 1Gi \
          --set-cloudsql-instances ${_SQL} \
          --set-env-vars "PGHOST=/cloudsql/${_SQL},PGUSER=postgres,PGDATABASE=vigia,BATCH_BUCKET=vigia-peru-batch,BATCH_PREFIJO=batch/" \
          --set-secrets "PGPASSWORD=cloudsql-password:latest" --quiet

timeout: 2400s
