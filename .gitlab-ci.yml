# CI/CD de Vigía Perú en GitLab — dos ambientes: dev y production (GitLab Environments).
# Despliega directo a Cloudflare con wrangler/opennextjs (SIN GCP: Cloud Build está muerto).
#
# Variables requeridas (Settings → CI/CD → Variables, "protected" y "masked"):
#   CLOUDFLARE_API_TOKEN    token de Cloudflare con permiso "Workers Scripts: Edit" (y acceso a los Workers/KV/R2 usados)
#   CLOUDFLARE_ACCOUNT_ID   id de la cuenta de Cloudflare (1cd0748daa880a849a2dae0baadfce34)
# wrangler y opennextjs-cloudflare leen esas dos variables del entorno.
# Para el BUILD del web (claves PÚBLICAS de cliente, NO masked): NEXT_PUBLIC_FIREBASE_API_KEY, _AUTH_DOMAIN,
# _PROJECT_ID, _STORAGE_BUCKET, _MESSAGING_SENDER_ID, _APP_ID, y NEXT_PUBLIC_TURNSTILE_SITE_KEY (la real de prod;
# DEV usa la de prueba, abajo en el job). Sin ellas el build falla al prerenderizar /login (Firebase invalid-api-key).
#
# Flujo: push a `dev` → pipeline con deploys a DEV (manual). Push a `main` → deploys a PRODUCTION (manual).
# Los deploys son manuales a propósito (botón ▶ en el pipeline), para no soltar a prod sin querer.
#
# NO cubierto aquí (se hace desde la PC con infrastructure/deploy/dev.sh, por el túnel a la RDS privada):
#   · migraciones de base (dev.sh migrar / sql)         · workers secundarios (scrapers, llm, precios, relay)
#   · el worker-dev.js del web-dev (franja DEV, noindex, clave) lo arma dev.sh; aquí el web-dev va con --env dev.

stages:
  - deploy
  - test

default:
  image: node:22-bookworm
  interruptible: true

# ─── Prueba: ¿la IP del runner de GitLab pasa el WAF de prod6 del SEACE? ───────────────────────────
# Para decidir si usamos runners de CI como "IPs extra" del backfill de contratos menores (el WAF de prod6
# bloquea el egress de Cloudflare y penaliza ráfagas desde una sola IP). Manual.
test:prod6:
  stage: test
  script:
    - |
      UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
      REF='https://prod6.seace.gob.pe/buscador-publico/contrataciones'
      B='https://prod6.seace.gob.pe/v1/s8uit-services'
      H=(-A "$UA" -H "Referer: $REF" -H "Origin: https://prod6.seace.gob.pe" -H "Accept: application/json, text/plain, */*")
      echo "== IP del runner =="; curl -s --max-time 20 https://ifconfig.me || true; echo
      echo "== buscador (Culminado 2026) =="
      curl -s --max-time 40 "${H[@]}" "$B/buscadorpublico/contrataciones/buscador?anio=2026&lista_estado_contrato=4&page=1&page_size=20" -o l.json -w "HTTP %{http_code} %{size_download}b\n"
      ids=$(node -e "const d=require('./l.json');console.log((d.data||[]).map(r=>r.idContrato).slice(0,10).join(' '))")
      echo "ids: $ids"
      echo "== secuencial: listar-archivos de 10 =="
      ok=0; f=0
      for id in $ids; do code=$(curl -s --max-time 30 "${H[@]}" -o a.json -w "%{http_code}" "$B/archivo/archivos-publico/listar-archivos-contrato/$id/1"); [ "$code" = "200" ] && ok=$((ok+1)) || f=$((f+1)); done
      echo "listar-archivos secuencial: ok=$ok fail=$f"
      echo "== descargar 1 requerimiento (PDF) =="
      rid=$(node -e "const d=require('./a.json');const l=Array.isArray(d)?d:(d.data||[]);console.log(l[0]?l[0].idContratoArchivo:'')")
      curl -s --max-time 60 "${H[@]}" -H "Accept: application/pdf" "$B/archivo/archivos-publico/descargar-archivo-contrato/$rid" -o r.pdf -w "PDF HTTP %{http_code} %{size_download}b\n"; head -c4 r.pdf | od -c | head -1
      echo "== burst 8 en paralelo (¿cuántos 403?) =="
      for id in $ids; do ( curl -s --max-time 30 "${H[@]}" -o /dev/null -w "%{http_code} " "$B/archivo/archivos-publico/listar-archivos-contrato/$id/1" ) & done; wait; echo
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# ─── Prueba: ¿el runner de GitLab (GCP-US) pasa el WAF de DJIC y corre el flujo con navegador? ──────
# DJIC (appdji.contraloria.gob.pe) exige navegador (WebForms + captcha en el DOM). El relay de Zúrich pasó;
# falta confirmar GCP-US. Si pasa, usamos CI como motor en nube para el Tier 2 de DJI. Manual.
test:djic:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
  script:
    - echo "== IP del runner =="; curl -s --max-time 20 https://ifconfig.me || true; echo
    - UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
    - echo "== GET del formulario DJIC =="
    - curl -s --max-time 40 -A "$UA" "https://appdji.contraloria.gob.pe/DJIC/ConsultaPublicaDJICRUC.aspx?ruc=20131378034" -o djic.html -w "GET HTTP %{http_code} %{size_download}b\n"
    - grep -q "txtApellidos" djic.html && echo "FORM OK -> la IP pasa el WAF" || { echo "SIN FORMULARIO -> posible bloqueo"; head -c 300 djic.html; }
    - pip install --quiet playwright==1.47.0 pdfplumber
    - python -m playwright install chromium
    - python backend/scripts/test_djic_ci.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# ─── Scrape DJI en paralelo (varias instancias = varias IPs, cada una suave con el servidor) ────────
# Cada nodo toma su porción (CI_NODE_INDEX de CI_NODE_TOTAL) de los targets y baja los PDFs como artefactos.
# El ingest a la base y la subida a R2 se hacen en local (donde están las credenciales). Manual en dev.
scrape:dji:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
  parallel: 5
  timeout: 3h
  variables:
    TARGETS: backend/scrapers-worker/dji_targets/targets_dji.csv
    HILOS: "2"
  script:
    - pip install --quiet playwright==1.47.0 pdfplumber
    - python -m playwright install chromium
    - mkdir -p dji_pdfs
    - python backend/scripts/scrape_dji.py --targets "$TARGETS" --out dji_pdfs --hilos "$HILOS" --shard "$((CI_NODE_INDEX-1))/$CI_NODE_TOTAL"
    - echo "PDFs del nodo:"; ls dji_pdfs/*.pdf 2>/dev/null | wc -l
  artifacts:
    paths: [dji_pdfs/]
    expire_in: 1 week
    when: always
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# ─── Anclas reutilizables ────────────────────────────────────────────────────────────────────────
.web: &web
  stage: deploy
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - NODE_OPTIONS=--max-old-space-size=4096 npm run cf:build
    - npx opennextjs-cloudflare deploy $DEPLOY_ENV
  timeout: 40m

.api: &api
  stage: deploy
  script:
    - cd backend/api
    - npm ci --no-audit --no-fund
    - npx wrangler deploy $DEPLOY_ENV

# ─── DEV (rama dev) ──────────────────────────────────────────────────────────────────────────────
deploy:api:dev:
  <<: *api
  variables: { DEPLOY_ENV: "--env dev" }
  environment:
    name: dev
    url: https://vigia-api-dev.vigiaperu.workers.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'   # DEV se despliega solo con cada push a dev

deploy:web:dev:
  <<: *web
  variables:
    DEPLOY_ENV: "--env dev"
    VIGIA_API_URL: "https://vigia-api-dev.vigiaperu.workers.dev"
    NEXT_PUBLIC_VIGIA_API_URL: "https://vigia-api-dev.vigiaperu.workers.dev"
    NEXT_PUBLIC_SITE_URL: "https://vigia-web-dev.vigiaperu.workers.dev"
    NEXT_PUBLIC_VIGIA_ENTORNO: "dev"
    NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"  # Turnstile de prueba (siempre pasa en DEV)
  environment:
    name: dev
    url: https://vigia-web-dev.vigiaperu.workers.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'   # DEV se despliega solo con cada push a dev

# ─── PRODUCTION (rama main) ──────────────────────────────────────────────────────────────────────
deploy:api:prod:
  <<: *api
  variables: { DEPLOY_ENV: "" }
  environment:
    name: production
    url: https://vigia-api.vigiaperu.workers.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy:web:prod:
  <<: *web
  variables:
    DEPLOY_ENV: ""
    VIGIA_API_URL: "https://vigia-api.vigiaperu.workers.dev"
    NEXT_PUBLIC_VIGIA_API_URL: "https://vigia-api.vigiaperu.workers.dev"
    NEXT_PUBLIC_SITE_URL: "https://vigia-web.vigiaperu.workers.dev"
    # NEXT_PUBLIC_TURNSTILE_SITE_KEY y los NEXT_PUBLIC_FIREBASE_* vienen de las variables del proyecto (prod reales).
  environment:
    name: production
    url: https://vigia-web.vigiaperu.workers.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
