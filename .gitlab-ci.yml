# CI/CD de Vigía Perú en GitLab — dos ambientes: dev y production (GitLab Environments).
# Despliega directo a Cloudflare con wrangler/opennextjs (SIN GCP: Cloud Build está muerto).
#
# Variables requeridas (Settings → CI/CD → Variables, "protected" y "masked"):
#   CLOUDFLARE_API_TOKEN    token de Cloudflare con permiso "Workers Scripts: Edit" (y acceso a los Workers/KV/R2 usados)
#   CLOUDFLARE_ACCOUNT_ID   id de la cuenta de Cloudflare (1cd0748daa880a849a2dae0baadfce34)
#   VIGIA_BUILD_TOKEN       el BUILD_TOKEN de vigia-api y vigia-api-dev: el build de la web lee la API cerrada al público
# wrangler y opennextjs-cloudflare leen esas dos variables del entorno.
# Para el BUILD del web (claves PÚBLICAS de cliente, NO masked): NEXT_PUBLIC_FIREBASE_API_KEY, _AUTH_DOMAIN,
# _PROJECT_ID, _STORAGE_BUCKET, _MESSAGING_SENDER_ID, _APP_ID, y NEXT_PUBLIC_TURNSTILE_SITE_KEY (la real de prod;
# DEV usa la de prueba, abajo en el job). Sin ellas el build falla al prerenderizar /login (Firebase invalid-api-key).
#
# Flujo: push a `dev` → pipeline con deploys a DEV (manual). Push a `main` → deploys a PRODUCTION (manual).
# Los deploys son manuales a propósito (botón ▶ en el pipeline), para no soltar a prod sin querer.
#
# NO cubierto aquí (se hace desde la PC con infrastructure/deploy/dev.sh, por el túnel a la RDS privada):
#   · migraciones de base (dev.sh migrar / sql)         · workers secundarios (scrapers, llm, precios, relay)
#   · el worker-dev.js del web-dev (franja DEV, noindex, clave) lo arma dev.sh; aquí el web-dev va con --env dev.

stages:
  - deploy
  - test

default:
  image: node:22-bookworm
  interruptible: true

# ─── Prueba: ¿la IP del runner de GitLab pasa el WAF de prod6 del SEACE? ───────────────────────────
# Para decidir si usamos runners de CI como "IPs extra" del backfill de contratos menores (el WAF de prod6
# bloquea el egress de Cloudflare y penaliza ráfagas desde una sola IP). Manual.
test:prod6:
  stage: test
  script:
    - |
      UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
      REF='https://prod6.seace.gob.pe/buscador-publico/contrataciones'
      B='https://prod6.seace.gob.pe/v1/s8uit-services'
      H=(-A "$UA" -H "Referer: $REF" -H "Origin: https://prod6.seace.gob.pe" -H "Accept: application/json, text/plain, */*")
      echo "== IP del runner =="; curl -s --max-time 20 https://ifconfig.me || true; echo
      echo "== buscador (Culminado 2026) =="
      curl -s --max-time 40 "${H[@]}" "$B/buscadorpublico/contrataciones/buscador?anio=2026&lista_estado_contrato=4&page=1&page_size=20" -o l.json -w "HTTP %{http_code} %{size_download}b\n"
      ids=$(node -e "const d=require('./l.json');console.log((d.data||[]).map(r=>r.idContrato).slice(0,10).join(' '))")
      echo "ids: $ids"
      echo "== secuencial: listar-archivos de 10 =="
      ok=0; f=0
      for id in $ids; do code=$(curl -s --max-time 30 "${H[@]}" -o a.json -w "%{http_code}" "$B/archivo/archivos-publico/listar-archivos-contrato/$id/1"); [ "$code" = "200" ] && ok=$((ok+1)) || f=$((f+1)); done
      echo "listar-archivos secuencial: ok=$ok fail=$f"
      echo "== descargar 1 requerimiento (PDF) =="
      rid=$(node -e "const d=require('./a.json');const l=Array.isArray(d)?d:(d.data||[]);console.log(l[0]?l[0].idContratoArchivo:'')")
      curl -s --max-time 60 "${H[@]}" -H "Accept: application/pdf" "$B/archivo/archivos-publico/descargar-archivo-contrato/$rid" -o r.pdf -w "PDF HTTP %{http_code} %{size_download}b\n"; head -c4 r.pdf | od -c | head -1
      echo "== burst 8 en paralelo (¿cuántos 403?) =="
      for id in $ids; do ( curl -s --max-time 30 "${H[@]}" -o /dev/null -w "%{http_code} " "$B/archivo/archivos-publico/listar-archivos-contrato/$id/1" ) & done; wait; echo
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# ─── Prueba: ¿el runner de GitLab (GCP-US) pasa el WAF de DJIC y corre el flujo con navegador? ──────
# DJIC (appdji.contraloria.gob.pe) exige navegador (WebForms + captcha en el DOM). El relay de Zúrich pasó;
# falta confirmar GCP-US. Si pasa, usamos CI como motor en nube para el Tier 2 de DJI. Manual.
test:djic:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
  script:
    - echo "== IP del runner =="; curl -s --max-time 20 https://ifconfig.me || true; echo
    - UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
    - echo "== GET del formulario DJIC =="
    - curl -s --max-time 40 -A "$UA" "https://appdji.contraloria.gob.pe/DJIC/ConsultaPublicaDJICRUC.aspx?ruc=20131378034" -o djic.html -w "GET HTTP %{http_code} %{size_download}b\n"
    - grep -q "txtApellidos" djic.html && echo "FORM OK -> la IP pasa el WAF" || { echo "SIN FORMULARIO -> posible bloqueo"; head -c 300 djic.html; }
    - pip install --quiet playwright==1.47.0 pdfplumber
    - python -m playwright install chromium
    - python backend/scripts/test_djic_ci.py
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# ─── Scrape DJI en paralelo (varias instancias = varias IPs, cada una suave con el servidor) ────────
# Cada nodo toma su porción (CI_NODE_INDEX de CI_NODE_TOTAL) de los targets y baja los PDFs como artefactos.
# El ingest a la base y la subida a R2 se hacen en local (donde están las credenciales). Manual en dev.
scrape:dji:
  stage: test
  needs: []
  image: mcr.microsoft.com/playwright/python:v1.47.0-jammy
  parallel: 10
  interruptible: false
  timeout: 3h
  variables:
    TARGETS: backend/scrapers-worker/dji_targets/targets_pendientes.csv
    # 4 hilos por nodo (40 sesiones): con los fallos rápidos de scrape_dji.py (2026-10-27) son ~3,600 intentos por hora,
    # menos que los ~5,000 que el portal ya aguantó en las primeras rondas con 2 hilos y casi todo descargas.
    HILOS: "4"
    # El script para solo a los 150 min para que los artefactos suban: si GitLab corta el job por tiempo, no sube nada.
    MINUTOS: "150"
    # Red de seguridad: si el script se colgara, a las 2 h 45 m se corta SÓLO el script y los artefactos igual suben.
    RUNNER_SCRIPT_TIMEOUT: 2h45m
  script:
    - pip install --quiet playwright==1.47.0 pdfplumber
    - python -m playwright install chromium
    - mkdir -p dji_pdfs
    - python backend/scripts/scrape_dji.py --targets "$TARGETS" --out dji_pdfs --hilos "$HILOS" --minutos "$MINUTOS" --shard "$((CI_NODE_INDEX-1))/$CI_NODE_TOTAL"
    - echo "PDFs del nodo:"; ls dji_pdfs/*.pdf 2>/dev/null | wc -l
  artifacts:
    paths: [dji_pdfs/]
    expire_in: 1 week
    when: always
  rules:
    # La rama `dji` la empuja backend/scripts/orquestar_dji.py con los pendientes de cada ronda: corre sola.
    - if: '$CI_COMMIT_BRANCH == "dji"'
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "dev"'
      when: manual
      allow_failure: true

# ─── Tareas pesadas en GitLab, no en la PC (pedido del usuario del 2026-11-05) ───────────────────────
# En la PC las corta la falta de memoria y dependen de que esté prendida. Aquí entran a la base privada por el MISMO
# túnel de Session Manager que usa la PC (infrastructure/aws/tunel_rds.py), con el token OIDC del rol
# vigia-gitlab-agentes (sólo desde main) y su política vigia-ci-base: abrir el túnel al proxy vigia-db-proxy y leer 4
# claves de SSM. A la base entran como `vigia_ci`, miembro de vigia_jobs (los permisos del Worker de scrapers), nunca
# como postgres. Manuales (▶) o por horario. Cada horario se reconoce por su DESCRIPCIÓN, que empieza con el nombre
# del job y dos puntos («menores-detalle: …»): el proyecto no deja variables en los horarios
# (ci_pipeline_variables_minimum_override_role = no_one_allowed) y hasta el 2026-11-11 ninguno corría su tarea.
.tarea_con_base: &tarea_con_base
  stage: test
  needs: []
  image: python:3.12-bookworm
  interruptible: false
  timeout: 3h
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_REGION: us-east-2
    AWS_DEFAULT_REGION: us-east-2
    AWS_ROLE_ARN: arn:aws:iam::416689419419:role/vigia-gitlab-agentes
    VIGIA_DB_USUARIO: vigia_ci
    PYTHONUNBUFFERED: "1"
  before_script:
    - echo "$AWS_ID_TOKEN" > /tmp/oidc && export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc
    - pip install --quiet awscli psycopg2-binary requests anthropic pypdf
    - curl -sSfL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o /tmp/smp.deb && dpkg -i /tmp/smp.deb > /dev/null
    - aws sts get-caller-identity --query Arn --output text
    - echo "IP del runner:" $(curl -s --max-time 10 https://ifconfig.me || echo "sin dato")

# El detalle de los contratos menores (área usuaria, invitación, ítems) directo desde el runner, despacio (el WAF de
# prod6 del SEACE bloqueó al relay y a la PC con ráfagas). Para a los 160 min; el siguiente retoma lo que falta.
tarea:menores-detalle:
  <<: *tarea_con_base
  script:
    - timeout 160m python -X utf8 backend/scripts/menores_detalle.py prod --detalle --directo --hilos 1 --pausa 2 || echo "cortado por tiempo o por el WAF; el siguiente retoma"
    - python -X utf8 backend/scripts/tareas_ci.py prod refrescar-menores
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($TAREA == "menores-detalle" || $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^menores-detalle:/)'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# Las órdenes de cada entidad por año (migración 148): en el Worker el año entero tarda ~150 s y no termina.
tarea:ordenes-anual:
  <<: *tarea_con_base
  timeout: 1h
  script:
    - python -X utf8 backend/scripts/tareas_ci.py prod ordenes-anual
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($TAREA == "ordenes-anual" || $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^ordenes-anual:/)'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# La lectura con IA de los contratos menores nuevos (requerimiento, contrato y sus segundas lecturas), con tope de gasto.
tarea:lector-menores:
  <<: *tarea_con_base
  script:
    - bash backend/lector/cadena_menores.sh prod 15 8
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($TAREA == "lector-menores" || $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^lector-menores:/)'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# Análisis masivo de contratos 2026 con las Lambdas de agentes de producción (Workers AI), con tope de gasto en el libro
# de la base (agente_masivo, migración 272). Lanza durante 155 min y deja terminar lo que está en vuelo; el horario lo
# repite cada 3 h hasta llegar al tope. Tope (US$ acumulados) en la variable del proyecto MASIVO_TOPE (obligatoria);
# reparto en MASIVO_PLAN (opcional). Un job a la vez (resource_group); ≤ 9 análisis a la vez en total (límite de Workers AI).
tarea:masivo-agentes:
  <<: *tarea_con_base
  resource_group: masivo-agentes
  script:
    - timeout 175m python -X utf8 backend/scripts/masivo_agentes.py prod --plan "${MASIVO_PLAN:-bienes=2 servicios,consultoria=2 obras=5}" --tope "${MASIVO_TOPE:?falta MASIVO_TOPE}" --minutos 155
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && ($TAREA == "masivo-agentes" || $CI_PIPELINE_SCHEDULE_DESCRIPTION =~ /^masivo-agentes:/)'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: true

# ─── Agentes (AWS Lambda) ────────────────────────────────────────────────────────────────────────
# Sin llaves: el job pide un token OIDC de GitLab y asume el rol vigia-gitlab-agentes (infrastructure/deploy/aws/
# gitlab_oidc.sh, sólo desde main). La imagen es la base de ECR ($AGENTE_BASE, con las dependencias ya instaladas)
# más una capa con backend/agent (crane append: sin Docker y sin emular arm64). Si cambia backend/agent/requirements.txt
# hay que rehacer la base (Dockerfile.lambda) y subir AGENTE_BASE.
.aws_agentes: &aws_agentes
  stage: deploy
  # El registro público de AWS a veces responde «toomanyrequests» al bajar la imagen del job: se reintenta solo.
  retry: { max: 2, when: [runner_system_failure, stuck_or_timeout_failure, unknown_failure] }
  image: { name: "public.ecr.aws/aws-cli/aws-cli:2.17.43", entrypoint: [""] }
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  variables:
    AWS_REGION: us-east-2
    AWS_DEFAULT_REGION: us-east-2
    AWS_ROLE_ARN: arn:aws:iam::416689419419:role/vigia-gitlab-agentes
    REPO: 416689419419.dkr.ecr.us-east-2.amazonaws.com/vigia-agente
    # Base protegida en ECR (prefijo base-: la regla de ciclo de vida guarda las 2 últimas; las demás imágenes, 10).
    AGENTE_BASE: base-a774ed8
    # Una Lambda por red (PIPELINE_PROFILE en su configuración): bienes, consultoría, obras, servicios, directas.
    FUNCIONES: "vigia-agente-sdk-v2 vigia-agente-consultoria vigia-agente-obras vigia-agente-servicios vigia-agente-directas"
  before_script:
    - echo "$AWS_ID_TOKEN" > /tmp/oidc && export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/oidc
    - aws sts get-caller-identity --query Arn --output text

build:agente:
  <<: *aws_agentes
  script:
    - yum install -y -q tar gzip >/dev/null
    - curl -sSL https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz | tar xz crane
    - aws ecr get-login-password | ./crane auth login "${REPO%%/*}" -u AWS --password-stdin
    - tar -C backend/agent --exclude='__pycache__' --exclude='./tests' --transform 's,^\.,app,' -cf /tmp/app.tar .
    - ./crane append --platform linux/arm64 --base "$REPO:$AGENTE_BASE" --new_layer /tmp/app.tar --new_tag "$REPO:$CI_COMMIT_SHORT_SHA-sdk"
    - echo "imagen $REPO:$CI_COMMIT_SHORT_SHA-sdk"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: [backend/agent/**/*]
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

deploy:agentes:prod:
  <<: *aws_agentes
  needs:
    - job: build:agente
      optional: true
  script:
    - |
      for f in $FUNCIONES; do
        aws lambda update-function-code --function-name "$f" --image-uri "$REPO:$CI_COMMIT_SHORT_SHA-sdk" --query LastUpdateStatus --output text
      done
      for f in $FUNCIONES; do aws lambda wait function-updated-v2 --function-name "$f" && echo "$f listo"; done
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

# ─── Anclas reutilizables ────────────────────────────────────────────────────────────────────────
.web: &web
  stage: deploy
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    # La API sólo atiende a nuestros Workers: el build prerenderiza con datos gracias a VIGIA_BUILD_TOKEN (variable
    # enmascarada; scripts/fetch-build.cjs lo manda en x-vigia-build y la API, que tiene el mismo BUILD_TOKEN, deja leer).
    - NODE_OPTIONS="--max-old-space-size=4096 --require $CI_PROJECT_DIR/frontend/scripts/fetch-build.cjs" npm run cf:build
    - npx opennextjs-cloudflare deploy $DEPLOY_ENV
  timeout: 40m

.api: &api
  stage: deploy
  script:
    - cd backend/api
    - npm ci --no-audit --no-fund
    - npx wrangler deploy $DEPLOY_ENV

# ─── Verificación (auditoría de producto del 2026-11-12, decisión D3) ─────────────────────────────
# Tipos, pruebas y guardia de estilo en cada push a main o dev. Van en la misma etapa que los despliegues y no los
# frenan (los despliegues son manuales y el script de despliegue los juega apenas existe el pipeline): si algo falla, el
# pipeline queda en rojo y se ve antes de dar al botón. Para que SÍ frenen: `needs: ["verificar:web"]` en deploy:web:*.
verificar:web:
  stage: deploy
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit -p .
    - npm test
    - npm run auditar:estilo
    # Un Server Component que usa una función de un módulo «use client» se cae al dibujar (2026-11-16): ni tsc lo avisa.
    - npm run auditar:limite
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes: ["frontend/**/*"]

verificar:api:
  stage: deploy
  script:
    - cd backend/api
    - npm ci --no-audit --no-fund
    - npx tsc --noEmit
    - npm test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
      changes: ["backend/api/**/*"]

# ─── DEV (rama dev) ──────────────────────────────────────────────────────────────────────────────
deploy:api:dev:
  <<: *api
  variables: { DEPLOY_ENV: "--env dev" }
  environment:
    name: dev
    url: https://vigia-api-dev.vigiaperu.workers.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'   # DEV se despliega solo con cada push a dev

deploy:web:dev:
  <<: *web
  variables:
    DEPLOY_ENV: "--env dev"
    VIGIA_API_URL: "https://vigia-api-dev.vigiaperu.workers.dev"
    NEXT_PUBLIC_VIGIA_API_URL: "https://vigia-api-dev.vigiaperu.workers.dev"
    NEXT_PUBLIC_SITE_URL: "https://vigia-web-dev.vigiaperu.workers.dev"
    NEXT_PUBLIC_VIGIA_ENTORNO: "dev"
    NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"  # Turnstile de prueba (siempre pasa en DEV)
  environment:
    name: dev
    url: https://vigia-web-dev.vigiaperu.workers.dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'   # DEV se despliega solo con cada push a dev

# ─── PRODUCTION (rama main) ──────────────────────────────────────────────────────────────────────
deploy:api:prod:
  <<: *api
  variables: { DEPLOY_ENV: "" }
  environment:
    name: production
    url: https://vigia-api.vigiaperu.workers.dev
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

deploy:web:prod:
  <<: *web
  variables:
    DEPLOY_ENV: ""
    VIGIA_API_URL: "https://vigia-api.vigiaperu.workers.dev"
    NEXT_PUBLIC_VIGIA_API_URL: "https://vigia-api.vigiaperu.workers.dev"
    # El dominio público (Vigía by Gobserva, 2026-10-29): enlaces para compartir e imágenes OG. vigia-web.vigiaperu.workers.dev
    # sigue sirviendo el mismo sitio. infrastructure/deploy/cloudflare/gobserva-redirect/README.md.
    NEXT_PUBLIC_SITE_URL: "https://vigia.gobserva.cloud"
    # NEXT_PUBLIC_TURNSTILE_SITE_KEY y los NEXT_PUBLIC_FIREBASE_* vienen de las variables del proyecto (prod reales).
  environment:
    name: production
    url: https://vigia.gobserva.cloud
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
