# Dependabot: avisos de seguridad (activados en Settings → Code security) y, con este archivo, actualizaciones de
# versión semanales agrupadas por paquete para no llenar el repo de PRs: una PR por carpeta, como mucho dos abiertas.
# Las versiones mayores (Next 15/16, wrangler 5…) no entran solas: se prueban en DEV a mano (docs/DEV.md).
version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend/api
      - /frontend
      - /backend/scrapers-worker
      - /backend/mcp-worker
      - /backend/llm-worker
      - /backend/precios-worker
      - /backend/relay-worker
      - /backend/r2-sync-worker
      - /backend/dispatcher-worker
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 2
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: pip
    directories:
      - /backend/agent
    schedule:
      interval: weekly
      day: monday
      timezone: America/Lima
    open-pull-requests-limit: 2
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "deps"
