# Fuentes del RAG normativo de Vigía Perú (Frente R, plan 2026-09-16 §3).
#
# Origen: las 13 fichas de rag-docs/propuesta.md + bases estándar + normas de control. Las URL
# "directas" de las fichas estaban en su mayoría rotas (404 en elperuano.pe, IDs de gob.pe que
# redirigen a otra norma, portal.osce.gob.pe sin respuesta). Se verificó cada fuente el
# 2026-09-16 desde IP peruana y se reemplazó por la página oficial de gob.pe (campo `pagina`,
# que es la `url_oficial` que cita el agente) más el PDF publicado en cdn.www.gob.pe (`pdf`).
# Si `pdf` falta, descargar.py lo resuelve leyendo la página oficial (primer enlace .pdf de
# cdn.www.gob.pe que cumpla `pdf_match`).
#
# Campos por fuente:
#   slug            nombre del objeto en GCS: gs://vigia-peru-rag/<corpus>/<slug>.pdf
#   documento       nombre corto para citar ("Art. N de <documento> (<url>)")
#   numero          número oficial de la norma/criterio
#   emisor          entidad que lo emite
#   corpus          normas-vigentes | normas-historicas | criterios-vinculantes | control-cgr (str o lista)
#   regimen         32069 | 30225 | ambos
#   tipo            norma | reglamento | criterio_vinculante | opinion | control | bases_estandar
#   vigencia_desde / vigencia_hasta   ISO (hasta: null = vigente)
#   pagina          URL oficial (HTML) → `url_oficial`
#   pdf             URL directa del PDF (opcional)
#   segmentar       true → segmentar.py parte el texto por "Artículo N" y se importan los artículos
#                   (un .txt por artículo) en vez del PDF completo
#   activa          false → documentada pero no se descarga (fuente pendiente / fase 2)
#   nota            observaciones (por qué se eligió esta versión, qué falta)

corpus:
  normas-vigentes:   "Ley 32069 y su Reglamento (textos consolidados con modificatorias), Ley de Presupuesto 2026, bases estándar 2025, TUO 27444"
  normas-historicas: "TUO Ley 30225 (D.S. 082-2019-EF) y Reglamento D.S. 344-2018-EF consolidado, TUO 27444 — ultraactivos para convocatorias hasta el 21-04-2025"
  criterios-vinculantes: "Acuerdos de Sala Plena TCE/TCP, Opiniones DTN (las 721 filas de opiniones_oece_estructurado + fichas)"
  control-cgr:       "Manual de Auditoría de Cumplimiento, directivas de control simultáneo/concurrente, Ley 31288, Ley 31358"
  resoluciones-tce:  "FASE 2 (no se carga): resoluciones del Tribunal por año; miles de PDF, solo si el costo lo permite"

