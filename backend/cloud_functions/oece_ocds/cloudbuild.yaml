# Receta COMPLETA y autocontenida de oece_ocds: vendorizar el código real (backend/scrapers),
# construir la imagen, subirla, desplegar el Cloud Run Job.
# Se sube desde la RAÍZ del repo (el paso 1 necesita ver backend/scrapers, que es la fuente de
# verdad del código — esta carpeta solo tiene la copia vendorizada + esta receta):
#
#   gcloud builds submit . --config backend/cloud_functions/oece_ocds/cloudbuild.yaml
#
# El OECE da 403 a las IP de GCP, así que el job sale por el Worker `vigia-relay` (Zúrich, 200 medido
# desde GCP el 30/09/2026): RELAY_URL + RELAY_TOKEN (secreto local-downloader-token). Corre DIARIO a las
# 06:00 de Lima sobre una ventana de 7 días (el release sale días después de la convocatoria).
#
substitutions:
  _IMAGE: 'us-central1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/scraper-oece-ocds'
  _JOB: 'scraper-oece-ocds'
  _REGION: 'us-central1'
  _SQL_CONNECTION: '${PROJECT_ID}:us-central1:vigia-db'
  _SA: 'vigia-jobs@${PROJECT_ID}.iam.gserviceaccount.com'
  _BUCKET: 'vigia-peru-batch'
  _MEM: '1Gi'
  _CPU: '1'
  _TIMEOUT: '1800s'
options:
  substitutionOption: ALLOW_LOOSE
  # ${PROJECT_ID} dentro de las sustituciones: todo va al proyecto de `gcloud builds submit --project`.
  dynamicSubstitutions: true
steps:
  # 1. copia fresca de backend/scrapers/oece_ocds + backend/scrapers/_core (+ los backend/scripts/
  #    que este pipeline usa) hacia ./vendor — nunca se construye con una copia vieja.
  - name: python:3.12-slim
    entrypoint: python
    args: ['backend/cloud_functions/_vendor.py', 'oece_ocds']

  # 2. imagen (Dockerfile de esta misma carpeta)
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:$BUILD_ID', '-t', '${_IMAGE}:latest', 'backend/cloud_functions/oece_ocds']

  # 3. subir
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}:$BUILD_ID']
  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_IMAGE}:latest']

  # 4. Cloud Run Job (Cloud SQL por el socket — no necesita IP en authorized-networks)
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_JOB}
      - --image=${_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --service-account=${_SA}
      - --tasks=1
      - --max-retries=1
      - --task-timeout=${_TIMEOUT}
      - --cpu=${_CPU}
      - --memory=${_MEM}
      - --set-cloudsql-instances=${_SQL_CONNECTION}
      - --set-env-vars=PGHOST=/cloudsql/${_SQL_CONNECTION},PGUSER=vigia_jobs,PGDATABASE=vigia,SCRAPER_GCS_BUCKET=${_BUCKET},RELAY_URL=https://vigia-relay.vigiaperu.workers.dev
      - --set-secrets=PGPASSWORD=cloudsql-password-jobs:latest,RELAY_TOKEN=local-downloader-token:latest
      - --quiet

  # 5. Cloud Scheduler: todos los días 06:00 America/Lima. update si ya existe, create la primera vez.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if gcloud scheduler jobs describe ${_JOB} --location ${_REGION} >/dev/null 2>&1; then ACCION=update; else ACCION=create; fi
        gcloud scheduler jobs "$$ACCION" http ${_JOB} --location ${_REGION}           --schedule "0 6 * * *" --time-zone "America/Lima"           --uri "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${_REGION}/jobs/${_JOB}:run"           --http-method POST --oauth-service-account-email ${_SA} --quiet

images:
  - '${_IMAGE}:$BUILD_ID'
  - '${_IMAGE}:latest'
timeout: 900s
